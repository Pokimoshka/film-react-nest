services:
  database:
    image: postgres:16-alpine
    container_name: film_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-exampledb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - film_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: film_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - database
    networks:
      - film_net

  backend:
    build:
      context: ./backend
    image: ghcr.io/${GITHUB_REPO}/backend:latest
    container_name: film_backend
    restart: unless-stopped
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@database:5432/${DATABASE_NAME:-exampledb}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PORT: 3000
      LOG_FORMAT: ${LOG_FORMAT:-dev}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - film_net

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/${GITHUB_REPO}/frontend:latest
    container_name: film_frontend
    restart: unless-stopped
    volumes:
      - frontend_dist:/app/dist
    networks:
      - film_net

  nginx:
    build:
      context: ./nginx
    image: ghcr.io/${GITHUB_REPO}/nginx:latest
    container_name: film_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - film_net

volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist:

networks:
  film_net:
    driver: bridge