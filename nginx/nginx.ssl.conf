# HTTP: ACME-челлендж + редирект на HTTPS для всех доменов
server {
    listen 80;
    server_name backpm17yandex.ru www.backpm17yandex.ru api.backpm17yandex.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: основной домен фронтенда
server {
    listen 443 ssl http2;
    server_name backpm17yandex.ru www.backpm17yandex.ru;

    ssl_certificate     /etc/nginx/certs/live/backpm17yandex.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/backpm17yandex.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /content/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS: поддомен API — проксирует запросы на бэкенд
server {
    listen 443 ssl http2;
    server_name api.backpm17yandex.ru;

    ssl_certificate     /etc/nginx/certs/live/backpm17yandex.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/backpm17yandex.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}